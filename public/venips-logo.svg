<svg viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan brillant (face avant gauche) -->
    <linearGradient id="cyanL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5E5"/>
      <stop offset="100%" stop-color="#00AAAA"/>
    </linearGradient>
    <!-- Vert foncé (face droite / ombre) -->
    <linearGradient id="greenD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A7A42"/>
      <stop offset="100%" stop-color="#0A3018"/>
    </linearGradient>
    <!-- Teal moyen -->
    <linearGradient id="tealM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C8C8"/>
      <stop offset="100%" stop-color="#007070"/>
    </linearGradient>
  </defs>

  <!-- ══════════════════════════════════════
       ICÔNE W (double V entrelacé)
       ══════════════════════════════════════ -->

  <!-- Bras gauche extérieur — face avant cyan -->
  <polygon points="6,10 20,10 14,72 2,60" fill="url(#cyanL)"/>

  <!-- Bras gauche intérieur — face avant cyan clair -->
  <polygon points="20,10 36,10 24,72 14,72" fill="#00D4D4"/>

  <!-- Chevron central montant — teal -->
  <polygon points="28,10 40,10 36,10 20,72 14,72 20,60" fill="url(#tealM)"/>

  <!-- Bras droit — face vert foncé -->
  <polygon points="36,10 52,10 46,60 32,72 24,72 36,40" fill="url(#greenD)"/>

  <!-- Pointe basse gauche — vert très foncé -->
  <polygon points="6,55 14,72 4,82 0,68" fill="#0A3018"/>

  <!-- Pointe basse droite — vert foncé -->
  <polygon points="32,72 40,82 36,88 28,80" fill="#0D4020"/>

  <!-- ══════════════════════════════════════
       TEXTE : VENiPS
       ══════════════════════════════════════ -->

  <!-- VEN -->
  <text
    x="68" y="68"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="white"
    letter-spacing="1"
  >VEN</text>

  <!-- i sans point (ı = dotless i U+0131) -->
  <text
    x="207" y="68"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="white"
    letter-spacing="1"
  >ı</text>

  <!-- PS -->
  <text
    x="223" y="68"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="white"
    letter-spacing="1"
  >PS</text>

  <!-- Deux points cyan au-dessus du i (comme dans le logo) -->
  <circle cx="218" cy="12" r="5" fill="#00E5E5"/>
  <circle cx="218" cy="26" r="4" fill="#00E5E5"/>
</svg>
